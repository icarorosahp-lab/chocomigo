<script>
  const API = "https://script.google.com/macros/s/AKfycbxgbfGrrF9TwRZ0R5KS8-gGnFzVH8vXTikEheMZRU3BITlc5J-3_Oh_WhrOEHXQJSKs/exec"; // ← confirma se este é o URL atual
  let currentId = null;
  let email = "";
  let clickCount = 0;
  let deadline = new Date('2026-11-28T23:59:59');
  let eventDate = '12/12/2026 19:30';
  let budget = '20';
  let status = 'open';

  // ===== UTIL =====
  function isOpen() {
    return new Date() <= deadline && status !== 'drawn';
  }

  async function loadConfig() {
    try {
      const res = await fetch(`${API}?action=getConfig`);
      const d = await res.json();

      // Datas
      if (d.registration_deadline) {
        deadline = new Date(d.registration_deadline + 'T23:59:59');
      }
      eventDate = d.event_date || '12/12/2026 19:30';
      budget = d.budget_limit || '20';
      status = d.status || 'open';

      // Atualizar todo o site
      document.getElementById('siteTitle').textContent = (d.event_name || 'Chocomigo').toUpperCase();
      document.getElementById('headerDate').textContent = eventDate;
      document.getElementById('footerDate').textContent = eventDate;
      document.getElementById('eventDateDisplay').textContent = eventDate;
      document.getElementById('budgetDisplay').textContent = budget + ' €';
      document.getElementById('deadlineText').textContent = deadline.toLocaleDateString('pt-PT');

      // Preencher campos do Admin
      document.getElementById('cfgName').value = d.event_name || 'Chocomigo';
      document.getElementById('cfgEventDate').value = eventDate;
      document.getElementById('cfgBudget').value = budget;
      document.getElementById('cfgDeadline').value = d.registration_deadline || '2026-11-28';

      updateUI();
    } catch (e) {
      console.error('Erro ao carregar config:', e);
    }
  }

  async function saveConfig() {
    const payload = {
      action: 'updateConfig',
      event_name: document.getElementById('cfgName').value.trim(),
      event_date: document.getElementById('cfgEventDate').value.trim(),
      budget_limit: document.getElementById('cfgBudget').value,
      registration_deadline: document.getElementById('cfgDeadline').value
    };

    try {
      const res = await fetch(API, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      const d = await res.json();

      if (d.success) {
        alert('Configurações guardadas com sucesso!');
        await loadConfig(); // recarrega tudo formatado
      } else {
        alert(d.error || 'Erro ao guardar configurações');
      }
    } catch (err) {
      alert('Erro de comunicação com o servidor');
    }
  }

  function updateUI() {
    const form = document.getElementById('registerForm');
    const closed = document.getElementById('registrationClosed');
    const badge = document.getElementById('phaseBadge');
    const countdown = document.getElementById('countdownSection');
    const login = document.getElementById('loginSection');
    const statusBadge = document.getElementById('adminStatusBadge');

    if (status === 'drawn') {
      form.classList.add('hidden');
      closed.classList.remove('hidden');
      badge.textContent = '🔒 Sorteio Realizado';
      badge.className = 'inline-block bg-red-500/15 text-red-300 border border-red-500/30 text-xs px-3 py-1.5 rounded-full font-semibold';
      countdown.classList.add('hidden');
      login.classList.remove('hidden');
      if (statusBadge) {
        statusBadge.textContent = 'SORTEIO FEITO';
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-red-500/20 text-red-300';
      }
    } else if (isOpen()) {
      form.classList.remove('hidden');
      closed.classList.add('hidden');
      badge.textContent = '🎄 Inscrições Abertas';
      badge.className = 'inline-block bg-amber-500/15 text-amber-300 border border-amber-500/30 text-xs px-3 py-1.5 rounded-full font-semibold';
      countdown.classList.remove('hidden');
      login.classList.add('hidden');
      if (statusBadge) {
        statusBadge.textContent = 'INSCRIÇÕES ABERTAS';
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300';
      }
    } else {
      form.classList.add('hidden');
      closed.classList.remove('hidden');
      badge.textContent = '🔒 Inscrições Encerradas';
      badge.className = 'inline-block bg-red-500/15 text-red-300 border border-red-500/30 text-xs px-3 py-1.5 rounded-full font-semibold';
      countdown.classList.add('hidden');
      login.classList.remove('hidden');
      if (statusBadge) {
        statusBadge.textContent = 'INSCRIÇÕES FECHADAS';
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300';
      }
    }
  }

  function updateCountdown() {
    const dist = deadline - new Date();
    if (dist < 0) {
      ['days', 'hours', 'minutes', 'seconds'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = '00';
      });
      updateUI();
      return;
    }
    document.getElementById('days').textContent = String(Math.floor(dist / 86400000)).padStart(2, '0');
    document.getElementById('hours').textContent = String(Math.floor((dist % 86400000) / 3600000)).padStart(2, '0');
    document.getElementById('minutes').textContent = String(Math.floor((dist % 3600000) / 60000)).padStart(2, '0');
    document.getElementById('seconds').textContent = String(Math.floor((dist % 60000) / 1000)).padStart(2, '0');
  }

  // ===== ADMIN =====
  async function setStatus(s) {
    const res = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ action: 'updateConfig', status: s })
    });
    const d = await res.json();
    if (d.success) {
      alert('Status atualizado!');
      await loadConfig();
    } else {
      alert(d.error || 'Erro');
    }
  }

  async function resetEvent() {
    if (!confirm('Isto vai APAGAR o sorteio e reabrir as inscrições. Continuar?')) return;
    const res = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ action: 'resetEvent' })
    });
    const d = await res.json();
    if (d.success) {
      alert(d.message);
      await loadConfig();
      loadParticipants();
    } else {
      alert(d.error || 'Erro');
    }
  }

  async function triggerDraw() {
    if (!confirm('Realizar o sorteio agora?')) return;
    const res = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ action: 'executeDraw' })
    });
    const d = await res.json();
    if (d.success) {
      alert(d.message);
      await loadConfig();
      loadParticipants();
    } else {
      alert(d.error || 'Erro ao realizar sorteio');
    }
  }

  async function loadParticipants() {
    const box = document.getElementById('participantsList');
    if (!box) return;
    box.innerHTML = '<div class="p-4 text-center text-emerald-500">A carregar...</div>';
    try {
      const res = await fetch(`${API}?action=getParticipants`);
      const list = await res.json();
      if (!Array.isArray(list) || list.length === 0) {
        box.innerHTML = '<div class="p-4 text-center text-emerald-500">Nenhum participante</div>';
        return;
      }
      let html = `
        <div class="grid grid-cols-12 gap-2 px-3 py-2 text-[10px] uppercase text-emerald-500 border-b border-emerald-800 bg-emerald-950/70 sticky top-0">
          <div class="col-span-5">Nome</div>
          <div class="col-span-5">E-mail</div>
          <div class="col-span-2 text-center">Estado</div>
        </div>`;
      list.forEach(p => {
        html += `
          <div class="grid grid-cols-12 gap-2 px-3 py-2.5 border-b border-emerald-900/50 text-xs">
            <div class="col-span-5 text-amber-200 truncate">${p.name || '—'}</div>
            <div class="col-span-5 text-emerald-300 truncate">${p.email}</div>
            <div class="col-span-2 text-center">${p.wishlist_completed ? '✅' : '⏳'} ${p.result_viewed ? '👁️' : ''}</div>
          </div>`;
      });
      box.innerHTML = html;
    } catch (e) {
      box.innerHTML = '<div class="p-4 text-center text-red-400">Erro ao carregar</div>';
    }
  }

  // ===== PARTICIPANTE =====
  async function register(e) {
    e.preventDefault();
    if (!isOpen()) {
      alert('Inscrições encerradas.');
      return;
    }
    const res = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({
        action: 'registerSelf',
        name: document.getElementById('regName').value,
        email: document.getElementById('regEmail').value,
        description: document.getElementById('regWishlist').value,
        reference_link: document.getElementById('regLink').value
      })
    });
    const d = await res.json();
    if (d.success) {
      alert('Inscrição feita com sucesso!');
      e.target.reset();
      switchTab('portal');
    } else {
      alert(d.error || 'Erro na inscrição');
    }
  }

  async function requestOtp(e) {
    e.preventDefault();
    email = document.getElementById('loginEmail').value;
    const res = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ action: 'requestOtp', email })
    });
    const d = await res.json();
    if (d.success) {
      document.getElementById('codeSentText').textContent = `Código enviado para ${email}`;
      document.getElementById('stepEmail').classList.add('hidden');
      document.getElementById('stepCode').classList.remove('hidden');
    } else {
      alert(d.error || 'Erro');
    }
  }

  async function verifyOtp(e) {
    e.preventDefault();
    const code = document.getElementById('loginCode').value;
    const res = await fetch(API, {
      method: 'POST',
      body: JSON.stringify({ action: 'verifyOtp', email, code })
    });
    const d = await res.json();
    if (d.success) {
      currentId = d.participant_id;
      document.getElementById('welcomeName').textContent = `Olá, ${d.name}!`;
      document.getElementById('stepCode').classList.add('hidden');
      document.getElementById('stepDashboard').classList.remove('hidden');
    } else {
      alert(d.error || 'Código inválido');
    }
  }

  async function openGift() {
    const res = await fetch(`${API}?action=getResult&id=${currentId}`);
    const d = await res.json();
    if (d.assigned_name) {
      document.getElementById('giftContainer').classList.add('hidden');
      document.getElementById('giftResult').classList.remove('hidden');
      document.getElementById('assignedName').textContent = d.assigned_name;
      document.getElementById('targetWishlist').innerHTML = `
        <p class="text-amber-300 font-bold mb-1">Lista de Desejos:</p>
        <p class="text-slate-200 mb-2">${d.description}</p>
        ${d.reference_link ? `<a href="${d.reference_link}" target="_blank" class="text-amber-300 underline text-xs">🔗 Ver link</a>` : ''}`;
    } else {
      alert(d.error || 'Sorteio ainda não realizado');
    }
  }

  // ===== NAVEGAÇÃO =====
  function switchTab(t) {
    ['register', 'portal', 'admin'].forEach(v => {
      const view = document.getElementById('view' + v.charAt(0).toUpperCase() + v.slice(1));
      const tab = document.getElementById('tab' + v.charAt(0).toUpperCase() + v.slice(1));
      if (view) view.classList.add('hidden');
      if (tab) tab.className = 'px-4 py-2 rounded-lg text-xs font-bold text-emerald-200';
    });
    const activeView = document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1));
    const activeTab = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
    if (activeView) activeView.classList.remove('hidden');
    if (activeTab) activeTab.className = 'px-4 py-2 rounded-lg text-xs font-bold tab-active';
    if (t === 'admin') loadParticipants();
  }

  function secretAdmin() {
    clickCount++;
    if (clickCount >= 5) {
      const tab = document.getElementById('tabAdmin');
      if (tab) {
        tab.style.display = (tab.style.display === 'none' || !tab.style.display) ? 'inline-block' : 'none';
        if (tab.style.display !== 'none') loadParticipants();
      }
      clickCount = 0;
    }
    setTimeout(() => clickCount = 0, 2000);
  }

  function createSnow() {
    const c = document.getElementById('snow');
    if (!c) return;
    for (let i = 0; i < 25; i++) {
      const f = document.createElement('div');
      f.className = 'snowflake';
      f.textContent = ['❄', '❅', '❆', '•'][Math.floor(Math.random() * 4)];
      f.style.left = Math.random() * 100 + 'vw';
      f.style.animationDuration = (7 + Math.random() * 8) + 's';
      f.style.animationDelay = Math.random() * 10 + 's';
      f.style.fontSize = (0.5 + Math.random() * 0.7) + 'rem';
      c.appendChild(f);
    }
  }

  // ===== INICIALIZAÇÃO =====
  document.addEventListener('DOMContentLoaded', () => {
    createSnow();
    loadConfig();
    setInterval(updateCountdown, 1000);
  });
</script>
